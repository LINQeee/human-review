name: Human review coverage

on:
  push:
    branches-ignore: [code-reviewed-badge]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-reviewed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Reconcile review marks with this commit
        id: coverage
        continue-on-error: true
        run: node .code-reviewed/ci/report.cjs --output "$RUNNER_TEMP/code-reviewed-report"
      - name: Produce an incomplete report if calculation failed
        if: steps.coverage.outcome == 'failure'
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          output = Path(os.environ['RUNNER_TEMP']) / 'code-reviewed-report'
          output.mkdir(parents=True, exist_ok=True)
          report = {'schemaVersion': 1, 'complete': False, 'commit': os.environ['GITHUB_SHA'], 'issues': ['Calculation failed; see workflow log.']}
          (output / 'report.json').write_text(json.dumps(report))
          (output / 'report.md').write_text('# Human review coverage\n\nIncomplete: calculation failed.\n\nCommit: ' + os.environ['GITHUB_SHA'] + '\n')
          (output / 'badge.json').write_text(json.dumps({'schemaVersion': 1, 'label': 'human reviewed', 'message': 'incomplete', 'color': 'lightgrey'}))
          (output / 'badge.svg').write_text('<svg xmlns="http://www.w3.org/2000/svg" width="210" height="20" role="img" aria-label="human reviewed: incomplete"><rect width="210" height="20" fill="#777"/><text x="8" y="14" fill="white" font-family="sans-serif" font-size="11">human reviewed: incomplete</text></svg>')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: human-review-report
          path: ${{ runner.temp }}/code-reviewed-report/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: report
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: human-review-report
          path: ${{ runner.temp }}/code-reviewed-report
      - name: Publish aggregate-only files on the badge branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          latest="$(git ls-remote origin "refs/heads/$DEFAULT_BRANCH" | cut -f1)"
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo 'A newer default-branch commit exists; skipping this outdated report.'
            exit 0
          fi
          jq -e --arg sha "$GITHUB_SHA" '.commit == $sha' "$RUNNER_TEMP/code-reviewed-report/report.json" > /dev/null
          badge_ref="$(git ls-remote origin refs/heads/code-reviewed-badge)"
          if [ -n "$badge_ref" ]; then
            git fetch --depth=1 origin refs/heads/code-reviewed-badge
            git checkout -B code-reviewed-badge FETCH_HEAD
          else
            git checkout --orphan code-reviewed-badge
            git rm -rf --ignore-unmatch .
          fi
          for file in badge.svg badge.json report.json report.md; do
            cp "$RUNNER_TEMP/code-reviewed-report/$file" "$file"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- badge.svg badge.json report.json report.md
          if ! git diff --cached --quiet; then
            git commit -m 'Update human review coverage'
            git push origin HEAD:refs/heads/code-reviewed-badge
          fi
